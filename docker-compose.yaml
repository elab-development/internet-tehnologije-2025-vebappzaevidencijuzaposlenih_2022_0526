version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: evidencija-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iteh_evidencija
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iteh_evidencija"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evidencija-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/iteh_evidencija
      JWT_SECRET: neka_jaka_tajna
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run start"

volumes:
  postgres_data: