name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
      - feature/cicd
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instaliraj zavisnosti
        run: npm ci

      - name: Pokreni testove
        run: npm test

  build:
    name: Build aplikacije i Docker image-a
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instaliraj zavisnosti
        run: npm ci

      - name: Build Next.js aplikacije
        run: npm run build
        env:
          JWT_SECRET: test-secret

      - name: Build Docker image
        run: docker build -t evidencija-app .